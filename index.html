<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор</title>
  <style>
    body {
      background: #1e1e2f;
      font-family: Arial;
      text-align: center;
      padding-top: 60px;
    }
    .calc {
      background: #2d2d44;
      width: 260px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 15px;
    }
    #display {
      width: 230px;
      height: 50px;
      font-size: 24px;
      text-align: right;
      margin-bottom: 10px;
    }
    button {
      width: 55px;
      height: 50px;
      font-size: 20px;
      margin: 3px;
      border: none;
      border-radius: 8px;
      background: #44445e;
      color: white;
    }
    .orange { background: orange; }
    .green  { background: green; }
    .red    { background: red; }
  </style>
</head>
<body>

  <div class="calc">
    <input type="text" id="display">

    <button class="red" onclick="clearAll()">C</button>
    <button onclick="press('(')">(</button>
    <button onclick="press(')')">)</button>
    <button class="orange" onclick="press('/')">÷</button>

    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button class="orange" onclick="press('*')">×</button>

    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button class="orange" onclick="press('-')">−</button>

    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button class="orange" onclick="press('+')">+</button>

    <button onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button onclick="deleteLast()">⌫</button>
    <button class="green" onclick="calculate()">=</button>
  </div>

  <script>
    // Добавить цифру или знак на экран
    function press(value) {
      document.getElementById("display").value += value;
    }

    // Очистить экран
    function clearAll() {
      document.getElementById("display").value = "";
    }

    // Удалить последний символ
    function deleteLast() {
      let text = document.getElementById("display").value;
      document.getElementById("display").value = text.slice(0, -1);
    }

    // Посчитать результат
    function calculate() {
      try {
        let text = document.getElementById("display").value;
        document.getElementById("display").value = eval(text);
      } catch {
        document.getElementById("display").value = "Ошибка";
      }
    }
  </script>

</body>
</html>
